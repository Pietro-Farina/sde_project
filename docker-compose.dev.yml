version: '3.8'

services:
  # Data Layer Service
  data-service:
    build:
      context: ./backend/booking-data
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/booking-data/.env
    ports:
      - "3002:3002"
    volumes:
      - ./backend/booking-data:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Business Logic Service
  booking-logic:
    build:
      context: ./backend/booking-logic
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/booking-logic/.env
    ports:
      - "3001:3001"
    volumes:
      - ./backend/booking-logic:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      data-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Paypal Adapter Service
  paypal-adapter:
    build:
      context: ./backend/paypal-adapter
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/paypal-adapter/.env
    ports:
      - "3003:3003"
    volumes:
      - ./backend/paypal-adapter:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      data-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  # Oauth Adapter Service
  oauth-adapter:
    build:
      context: ./backend/oauth-adapter
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/oauth-adapter/.env
    ports:
      - "3004:3004"
    volumes:
      - ./backend/oauth-adapter:/app
      - /app/node_modules
    depends_on:
      data-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orchestrator Service
  booking-orchestrator:
    build:
      context: ./backend/booking-orchestrator
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/booking-orchestrator/.env
    ports:
      - "3000:3000"
    volumes:
      - ./backend/booking-orchestrator:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      booking-logic:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  # Frontend Service 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_HOST=0.0.0.0
      - VITE_API_URL=http://localhost:3000/api
      - NODE_ENV=development
    env_file:
      - ./frontend/.env
    depends_on:
      booking-orchestrator:
        condition: service_started

  # Booking Cleanup Cron Job
  booking-cleanup-cron:
    build: ./backend/booking-cleanup-cron
    environment:
      - CLEANUP_API_URL=http://data-service:3002/api/data/reservations/cleanup-expired
      - CLEANUP_API_KEY=your-internal-api-key # Optional, if you secure the endpoint
    depends_on:
      - data-service
    restart: unless-stopped

  # API Documentation Server
  api-docs-server:
    build: ./api-docs
    ports:
      - "4000:4000"
    depends_on:
      - booking-orchestrator
      - booking-logic
      - data-service
      - paypal-adapter
      - oauth-adapter