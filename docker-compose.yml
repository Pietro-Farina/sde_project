version: '3.8'

services:
  # Data Layer Service
  data-service:
    build:
      context: ./backend/booking-data
      dockerfile: Dockerfile
    env_file:
      - ./backend/booking-data/.env
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Business Logic Service
  booking-logic:
    build:
      context: ./backend/booking-logic
      dockerfile: Dockerfile
    env_file:
      - ./backend/booking-logic/.env
    ports:
      - "3001:3001"
    depends_on:
      data-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orchestrator Service
  booking-orchestrator:
    build:
      context: ./backend/booking-orchestrator
      dockerfile: Dockerfile
    env_file:
      - ./backend/booking-orchestrator/.env
    ports:
      - "3000:3000"
    depends_on:
      booking-logic:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  # Frontend Service 
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_HOST=0.0.0.0
      # Points backed API to backend service name (Docker DNS)
      - VITE_API_URL=http://booking-orchestrator:3000
    depends_on:
      booking-orchestrator:
        condition: service_started